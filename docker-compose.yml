services:
  # ═══════════════════════════════════════════════════════
  # 基础设施
  # ═══════════════════════════════════════════════════════

  redis:
    image: redis:7.4-alpine
    container_name: dr-redis
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16
    container_name: dr-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-deep_research}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deep_research"]
      interval: 5s
      timeout: 3s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: dr-milvus
    command: ["milvus", "run", "standalone"]
    expose:
      - "19530"
      - "9091"
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      # 本地存储模式：不依赖 MinIO，数据落在 /var/lib/milvus（milvus_data 卷）
      COMMON_STORAGETYPE: "local"
      MILVUS_CONFIG_CPU_CACHE_CAPACITY: 2
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ═══════════════════════════════════════════════════════
  # 应用服务
  # ═══════════════════════════════════════════════════════

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dr-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BOCHA_API_KEY=${BOCHA_API_KEY:-}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - MAX_ITERATIONS=2
      - REDIS_URL=redis://redis:6379
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-deep_research}?sslmode=disable
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - CHECKPOINTER_BACKEND=redis
      - ENABLE_MEMORY=true
      - ENABLE_MILVUS=true
      - SHORT_TERM_BACKEND=postgres
      - LONG_TERM_BACKEND=postgres
      - EMBEDDING_PROVIDER=huggingface
      - EMBEDDING_MODEL=BAAI/bge-small-zh-v1.5
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./knowledge_base:/app/knowledge_base

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dr-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  milvus_data:
